<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hanzi 2.0 — Lær kinesisk på norsk</title>
    <meta name="description" content="Lær kinesiske tegn på norsk. Daglige leksjoner, spaced repetition, uttale og skriveøvelse." />
    <meta name="theme-color" content="#1a120e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
      }
      html, body { min-height: 100%; }
      body { margin: 0; font-family: var(--font-sans); background: #f6efe6; color: #1a120e; }
      .dark body, html.dark { background: #0d0b0a; color: #f3ece4; }
      .hanzi { font-family: "Noto Serif SC", "Songti SC", serif; font-weight: 600; }
      .paper-grain {
        background-image:
          radial-gradient(ellipse at top, rgba(194, 59, 42, 0.07), transparent 50%),
          radial-gradient(ellipse at bottom right, rgba(201, 162, 39, 0.05), transparent 45%);
      }
      html.dark .paper-grain {
        background-image:
          radial-gradient(ellipse at top, rgba(194, 59, 42, 0.14), transparent 48%),
          radial-gradient(ellipse at bottom, rgba(20, 16, 14, 0.92), transparent 60%);
      }
      .glass { background: rgba(246, 239, 230, 0.82); backdrop-filter: blur(16px); }
      html.dark .glass { background: rgba(22, 17, 14, 0.82); }
      @keyframes ink-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .ink-in { animation: ink-in 0.35s ease both; }
      ::selection { background: #f3c7bf; color: #4a1610; }
    </style>
  </head>
  <body class="paper-grain antialiased">
    <div id="root"></div>
    <script type="importmap">
      {
        "imports": {
          "preact": "https://esm.sh/preact@10.25.4",
          "preact/hooks": "https://esm.sh/preact@10.25.4/hooks",
          "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
